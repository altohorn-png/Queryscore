<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生成績查詢系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'urushi': '#65483d', /* Deep brown for text/primary */
                        'matcha': '#81b29a', /* Pastel green */
                        'shoubu': '#df9c9d', /* Pastel pink */
                        'board-bg': '#fbf8f1',
                        'wall': '#e6d5cf',
                        'floor': '#6d4c41',
                        'board-border': '#bcaaa4'
                    },
                    fontFamily: {
                        'sans': ['"Klee One"', 'cursive', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Klee One', cursive, sans-serif;
            background-color: #e6d5cf;
            color: #65483d;
            overflow-x: hidden;
        }
        .cute-board {
            background-color: #fbf8f1;
            border: 12px solid #bcaaa4;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1), inset 0 0 15px rgba(188,170,164,0.2);
        }
        .cute-table-wrap {
            border: 3px dashed #bcaaa4;
            border-radius: 12px;
            background-color: rgba(255,255,255,0.5);
        }
        table { border-collapse: separate; border-spacing: 0; width: 100%; }
        th, td { border: 2px solid #e8ddd8; }
        th { background-color: #81b29a; color: white; font-weight: 600; letter-spacing: 0.05em; padding: 10px; }
        td { padding: 10px; }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #bcaaa4; border-radius: 10px; border: 2px solid #fbf8f1; }
        ::-webkit-scrollbar-thumb:hover { background: #81b29a; }
        
        .bg-urushi { background-color: #65483d; }
        .text-urushi { color: #65483d; }
        .bg-matcha { background-color: #81b29a; }
        .border-matcha { border-color: #81b29a; }
        .text-matcha { color: #81b29a; }
        .bg-shoubu { background-color: #df9c9d; }
        .border-shoubu { border-color: #df9c9d; }
        
        input, select {
            background-color: transparent;
            border: 2px dashed #bcaaa4;
            border-radius: 8px;
            font-family: inherit;
        }
        input:focus, select:focus {
            border-style: solid;
            border-color: #81b29a;
            outline: none;
            background-color: white;
        }
        button { font-family: inherit; font-weight: 600; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative z-0">
    
    <!-- Background Scene Elements -->
    <div class="fixed inset-0 bg-wall -z-20"></div>
    <div class="fixed bottom-0 left-0 w-full h-[20vh] bg-floor -z-10 border-t-8 border-[#543930]"></div>

    <!-- SVG Decorations -->
    <!-- Clock -->
    <svg class="fixed top-8 right-8 w-24 h-24 -z-10 hidden md:block opacity-90" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="45" fill="#81b29a" stroke="#65483d" stroke-width="4"/>
        <circle cx="50" cy="50" r="35" fill="#fbf8f1"/>
        <line x1="50" y1="50" x2="50" y2="25" stroke="#65483d" stroke-width="3" stroke-linecap="round"/>
        <line x1="50" y1="50" x2="65" y2="60" stroke="#65483d" stroke-width="3" stroke-linecap="round"/>
        <circle cx="50" cy="50" r="4" fill="#df9c9d"/>
        <line x1="50" y1="18" x2="50" y2="22" stroke="#65483d" stroke-width="2"/>
        <line x1="82" y1="50" x2="78" y2="50" stroke="#65483d" stroke-width="2"/>
        <line x1="50" y1="82" x2="50" y2="78" stroke="#65483d" stroke-width="2"/>
        <line x1="18" y1="50" x2="22" y2="50" stroke="#65483d" stroke-width="2"/>
    </svg>

    <!-- Hanging Photos -->
    <svg class="fixed top-0 left-10 w-64 h-32 -z-10 hidden md:block opacity-90" viewBox="0 0 200 100">
        <path d="M 0,10 Q 50,40 100,15 T 200,20" fill="none" stroke="#65483d" stroke-width="2" stroke-dasharray="4,4"/>
        <!-- Photo 1 -->
        <rect x="20" y="25" w="35" h="40" fill="#fbf8f1" stroke="#bcaaa4" stroke-width="2" transform="rotate(-5 37 45)"/>
        <rect x="25" y="30" w="25" h="25" fill="#e6d5cf" transform="rotate(-5 37 45)"/>
        <path d="M 37,20 L 37,28" stroke="#65483d" stroke-width="2"/>
        <!-- Photo 2 -->
        <rect x="80" y="15" w="35" h="40" fill="#fbf8f1" stroke="#bcaaa4" stroke-width="2" transform="rotate(8 97 35)"/>
        <rect x="85" y="20" w="25" h="25" fill="#81b29a" transform="rotate(8 97 35)"/>
        <path d="M 97,10 L 97,18" stroke="#65483d" stroke-width="2"/>
        <!-- Photo 3 -->
        <rect x="140" y="22" w="35" h="40" fill="#fbf8f1" stroke="#bcaaa4" stroke-width="2" transform="rotate(-3 157 42)"/>
        <circle cx="157" cy="35" r="12" fill="#df9c9d" transform="rotate(-3 157 42)"/>
        <path d="M 157,17 L 157,25" stroke="#65483d" stroke-width="2"/>
    </svg>

    <!-- Desk & Monitor -->
    <svg class="fixed bottom-0 left-10 w-64 h-64 -z-10 hidden xl:block opacity-90" viewBox="0 0 200 200">
        <rect x="40" y="140" width="8" height="60" fill="#bcaaa4" stroke="#65483d" stroke-width="2"/>
        <rect x="160" y="140" width="8" height="60" fill="#bcaaa4" stroke="#65483d" stroke-width="2"/>
        <rect x="10" y="130" width="180" height="15" fill="#f4e4d8" stroke="#65483d" stroke-width="2" rx="4"/>
        <rect x="85" y="110" width="30" height="20" fill="#e6d5cf" stroke="#65483d" stroke-width="2"/>
        <rect x="70" y="125" width="60" height="5" fill="#e6d5cf" stroke="#65483d" stroke-width="2"/>
        <rect x="50" y="50" width="100" height="65" fill="#fbf8f1" stroke="#65483d" stroke-width="3" rx="4"/>
        <rect x="55" y="55" width="90" height="50" fill="#ffffff" stroke="#bcaaa4" stroke-width="1"/>
        <circle cx="100" cy="75" r="8" fill="#bcaaa4"/>
        <path d="M 85,95 Q 100,80 115,95" fill="none" stroke="#bcaaa4" stroke-width="8" stroke-linecap="round"/>
    </svg>

    <!-- Potted Plant -->
    <svg class="fixed bottom-[15vh] right-10 w-40 h-48 -z-10 hidden xl:block opacity-90" viewBox="0 0 150 200">
        <path d="M 75,120 Q 20,80 30,30 Q 60,60 75,120" fill="#81b29a" stroke="#65483d" stroke-width="2"/>
        <path d="M 75,120 Q 130,80 120,30 Q 90,60 75,120" fill="#6ba382" stroke="#65483d" stroke-width="2"/>
        <path d="M 75,120 Q 0,110 10,70 Q 40,80 75,120" fill="#588f6c" stroke="#65483d" stroke-width="2"/>
        <path d="M 75,120 Q 150,110 140,70 Q 110,80 75,120" fill="#81b29a" stroke="#65483d" stroke-width="2"/>
        <path d="M 75,120 Q 60,50 75,10 Q 90,50 75,120" fill="#a3c4b5" stroke="#65483d" stroke-width="2"/>
        <path d="M 50,120 L 100,120 L 90,190 L 60,190 Z" fill="#fbf8f1" stroke="#65483d" stroke-width="3"/>
        <rect x="45" y="115" width="60" height="15" fill="#fbf8f1" stroke="#65483d" stroke-width="3" rx="4"/>
    </svg>

    <div id="toast" class="fixed top-8 left-1/2 transform -translate-x-1/2 bg-urushi text-white px-8 py-3 rounded-full shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none z-50 font-bold tracking-widest text-center border-2 border-[#bcaaa4]">
        訊息提示
    </div>

    <!-- MAIN CONTAINER (The Whiteboard) -->
    <div class="cute-board w-full max-w-5xl h-[85vh] md:h-[80vh] flex flex-col items-center justify-start p-6 md:p-10 relative overflow-y-auto">
        
        <!-- Login View -->
        <div id="login-view" class="w-full max-w-sm flex flex-col items-center justify-center h-full transition-all duration-500">
            <div class="mb-10 text-center">
                <h1 class="text-4xl md:text-5xl text-urushi font-bold mb-4 tracking-widest" style="text-shadow: 2px 2px 0px rgba(0,0,0,0.05);">學生成績查詢</h1>
                <div class="h-1 w-24 bg-matcha mx-auto rounded-full"></div>
            </div>
            
            <form id="login-form" class="space-y-6 w-full bg-white/40 p-8 rounded-2xl border-2 border-dashed border-[#bcaaa4]">
                <div>
                    <label class="block text-sm font-bold text-urushi mb-2 ml-2">學號 ID</label>
                    <input type="text" id="student-id" required placeholder="請輸入學號..." class="w-full px-4 py-3 text-center text-lg text-urushi shadow-inner">
                </div>
                <div>
                    <label class="block text-sm font-bold text-urushi mb-2 ml-2">密碼 Password</label>
                    <input type="password" id="password" required placeholder="請輸入密碼..." class="w-full px-4 py-3 text-center text-lg text-urushi shadow-inner">
                </div>
                <button type="submit" class="w-full bg-urushi hover:bg-[#81b29a] text-white py-4 rounded-xl transition-colors tracking-widest text-xl mt-4 shadow-md hover:shadow-lg transform hover:-translate-y-1">
                    登入系統
                </button>
            </form>
        </div>

        <!-- Main View -->
        <div id="main-view" class="hidden w-full space-y-6 transition-all duration-500">
            
            <div class="cute-table-wrap p-4 md:p-6 flex flex-col sm:flex-row justify-between items-center gap-4 bg-white/70">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 bg-shoubu rounded-full flex items-center justify-center text-white text-2xl font-bold border-4 border-white shadow-sm">
                        <span id="user-avatar">生</span>
                    </div>
                    <div>
                        <h2 class="text-2xl font-bold text-urushi"><span id="display-name">使用者</span> <span class="text-lg font-normal text-[#8b6b5d]">同學，您好！</span></h2>
                        <p class="text-sm text-[#8b6b5d] mt-1 bg-white/50 inline-block px-3 py-1 rounded-full border border-[#bcaaa4]">學號: <span id="display-id" class="font-bold">000000</span></p>
                    </div>
                </div>
                <div class="flex flex-col sm:flex-row gap-3 w-full sm:w-auto items-center">
                    <select id="exam-select" class="px-4 py-2 bg-white text-urushi shadow-sm w-full sm:w-auto font-bold text-center">
                        <option value="">載入中...</option>
                    </select>
                    <div class="flex gap-2 w-full sm:w-auto justify-center">
                        <button onclick="showChangePassword()" class="px-4 py-2 border-2 border-urushi text-urushi hover:bg-urushi hover:text-white rounded-lg transition-colors text-sm font-bold">更改密碼</button>
                        <button onclick="logout()" class="px-4 py-2 bg-[#e6d5cf] text-urushi hover:bg-[#df9c9d] hover:text-white rounded-lg transition-colors text-sm font-bold">登出</button>
                    </div>
                </div>
            </div>

            <div id="loading-state" class="hidden text-center py-16 cute-table-wrap bg-white/40">
                <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-matcha mx-auto"></div>
                <p class="mt-6 text-urushi font-bold tracking-widest text-lg">正在翻閱成績本...</p>
            </div>

            <div id="grades-content" class="hidden space-y-8">
                <!-- Personal Grades -->
                <div class="cute-table-wrap p-3 md:p-6 bg-white/60 overflow-x-auto">
                    <div class="flex items-center gap-3 mb-4 pl-2">
                        <div class="w-3 h-8 bg-matcha rounded-full"></div>
                        <h3 class="text-xl font-bold text-urushi">個人成績明細</h3>
                    </div>
                    <table class="w-full text-sm text-center rounded-lg overflow-hidden">
                        <thead id="personal-grades-head"></thead>
                        <tbody id="personal-grades-body" class="bg-white/80"></tbody>
                    </table>
                </div>

                <!-- Stats -->
                <div class="cute-table-wrap p-3 md:p-6 bg-white/60 overflow-x-auto">
                    <div class="flex items-center gap-3 mb-4 pl-2">
                        <div class="w-3 h-8 bg-shoubu rounded-full"></div>
                        <h3 class="text-xl font-bold text-urushi">各科評量分析 <span class="text-sm font-normal text-[#8b6b5d]">(含組距)</span></h3>
                    </div>
                    <table class="w-full text-sm text-center rounded-lg overflow-hidden">
                        <thead>
                            <tr class="bg-shoubu text-white">
                                <th class="py-3 px-2 bg-shoubu whitespace-nowrap border-r border-[#fbf8f1]/30">科目</th>
                                <th class="py-3 px-2 bg-shoubu whitespace-nowrap border-r border-[#fbf8f1]/30">平均</th>
                                <th class="py-3 px-2 bg-shoubu whitespace-nowrap border-r border-[#fbf8f1]/30">高標</th>
                                <th class="py-3 px-2 bg-shoubu whitespace-nowrap border-r border-[#fbf8f1]/30">100分</th>
                                <th class="py-3 px-2 bg-shoubu whitespace-nowrap border-r border-[#fbf8f1]/30">90-99分</th>
                                <th class="py-3 px-2 bg-shoubu whitespace-nowrap border-r border-[#fbf8f1]/30">80-89分</th>
                                <th class="py-3 px-2 bg-shoubu whitespace-nowrap border-r border-[#fbf8f1]/30">70-79分</th>
                                <th class="py-3 px-2 bg-shoubu whitespace-nowrap border-r border-[#fbf8f1]/30">60-69分</th>
                                <th class="py-3 px-2 bg-shoubu whitespace-nowrap">60分以下</th>
                            </tr>
                        </thead>
                        <tbody id="stats-grades-body" class="bg-white/80"></tbody>
                    </table>
                    <p class="text-sm text-[#8b6b5d] mt-4 text-right font-bold">* 高標定義：該科前50%學生的平均分數</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Password Modal -->
    <div id="password-modal" class="hidden fixed inset-0 bg-[#543930]/60 backdrop-blur-sm flex items-center justify-center z-40 p-4">
        <div class="cute-board p-8 w-full max-w-sm relative">
            <div class="absolute -top-3 left-1/2 transform -translate-x-1/2 w-20 h-6 bg-white/50 backdrop-blur-sm shadow-sm rotate-[-2deg]"></div>
            
            <h2 class="text-2xl font-bold text-urushi mb-6 text-center">更改密碼</h2>
            <div class="space-y-4">
                <input type="password" id="old-pw" placeholder="原密碼" class="w-full px-4 py-3 bg-white">
                <input type="password" id="new-pw" placeholder="新密碼" class="w-full px-4 py-3 bg-white">
                <input type="password" id="new-pw-confirm" placeholder="確認新密碼" class="w-full px-4 py-3 bg-white">
                <div class="flex gap-3 mt-8">
                    <button onclick="hideChangePassword()" class="w-1/2 px-4 py-3 border-2 border-urushi text-urushi hover:bg-gray-100 rounded-lg transition-colors font-bold shadow-sm">取消</button>
                    <button onclick="submitChangePassword()" class="w-1/2 px-4 py-3 bg-matcha text-white hover:bg-[#6ba382] rounded-lg transition-colors font-bold shadow-sm">確認修改</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbx8n9EG64lyOpHsg4IKpltL048QwpKzYVz5b26A6jVXgBZBdmag2kkbbyveZS67HHGP3A/exec"; 
        let currentUser = null;

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => { toast.classList.add('opacity-0'); }, 3000);
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('student-id').value.trim();
            const pw = document.getElementById('password').value.trim();
            const btn = e.target.querySelector('button');
            
            btn.textContent = "登入中...";
            btn.disabled = true;

            try {
                const res = await fetch(`${GAS_URL}?action=login&id=${encodeURIComponent(id)}&pw=${encodeURIComponent(pw)}`, {
                    method: 'GET',
                    mode: 'cors',
                    redirect: 'follow'
                });
                const data = await res.json();
                
                if (data.success) {
                    currentUser = { id: id, name: data.name };
                    loginSuccess();
                } else {
                    throw new Error(data.message || '登入失敗');
                }
            } catch (err) {
                showToast(err.message);
            } finally {
                btn.textContent = "登入系統";
                btn.disabled = false;
            }
        });

        async function loginSuccess() {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('main-view').classList.remove('hidden');
            document.getElementById('display-name').textContent = currentUser.name;
            document.getElementById('display-id').textContent = currentUser.id;
            document.getElementById('user-avatar').textContent = currentUser.name.charAt(0);
            await loadExams();
        }

        function logout() {
            currentUser = null;
            document.getElementById('main-view').classList.add('hidden');
            document.getElementById('grades-content').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
            document.getElementById('login-form').reset();
            document.getElementById('exam-select').innerHTML = '<option value="">載入中...</option>';
        }

        async function loadExams() {
            try {
                const res = await fetch(`${GAS_URL}?action=getExams`, { method: 'GET', mode: 'cors', redirect: 'follow' });
                const data = await res.json();
                
                if(data.success) {
                    const select = document.getElementById('exam-select');
                    select.innerHTML = '<option value="" disabled selected>請選擇評量...</option>';
                    data.exams.forEach(exam => {
                        const opt = document.createElement('option');
                        opt.value = exam;
                        opt.textContent = exam;
                        select.appendChild(opt);
                    });
                    select.addEventListener('change', (e) => loadGrades(e.target.value));
                    if(data.exams.length > 0) {
                        select.value = data.exams[0];
                        loadGrades(data.exams[0]);
                    }
                }
            } catch (err) { showToast('載入評量清單失敗'); }
        }

        async function loadGrades(examName) {
            if (!examName) return;
            document.getElementById('grades-content').classList.add('hidden');
            document.getElementById('loading-state').classList.remove('hidden');

            try {
                const res = await fetch(`${GAS_URL}?action=getGrades&exam=${encodeURIComponent(examName)}&id=${encodeURIComponent(currentUser.id)}`, {
                    method: 'GET', mode: 'cors', redirect: 'follow'
                });
                const data = await res.json();
                
                if(data.success) {
                    renderPersonalGrades(data.headers, data.personal);
                    renderStats(data.stats);
                    document.getElementById('loading-state').classList.add('hidden');
                    document.getElementById('grades-content').classList.remove('hidden');
                } else {
                    throw new Error(data.message);
                }
            } catch (err) {
                document.getElementById('loading-state').classList.add('hidden');
                showToast('讀取成績失敗：' + err.message);
            }
        }

        function renderPersonalGrades(headers, data) {
            const thead = document.getElementById('personal-grades-head');
            const tbody = document.getElementById('personal-grades-body');

            let thHtml = '<tr>';
            headers.forEach(h => {
                let thClass = "py-3 px-2 whitespace-nowrap border-r border-[#fbf8f1]/30"; 
                if (h.includes('平時')) thClass += " bg-opacity-80";
                if (h.includes('總分') || h.includes('平均')) thClass += " bg-urushi";
                thHtml += `<th class="${thClass}">${h}</th>`;
            });
            thHtml += '</tr>';
            thead.innerHTML = thHtml;

            let tdHtml = '<tr class="hover:bg-white transition-colors">';
            headers.forEach(h => {
                let val = (data[h] !== undefined && data[h] !== '') ? data[h] : '-';
                let tdClass = "py-3 px-2 whitespace-nowrap";
                if (h === '姓名' || h.includes('定期')) tdClass += " font-bold text-urushi";
                else if (h.includes('平時')) tdClass += " text-[#8b6b5d]";
                else if (h.includes('總分') || h.includes('平均')) tdClass += " font-bold text-[#df9c9d]";
                tdHtml += `<td class="${tdClass}">${val}</td>`;
            });
            tdHtml += '</tr>';
            tbody.innerHTML = tdHtml;
        }

        function renderStats(stats) {
            const tbody = document.getElementById('stats-grades-body');
            let html = '';
            
            for (let sub in stats) {
                const s = stats[sub];
                let displayName = sub.replace('定期', '');
                html += `
                    <tr class="hover:bg-white transition-colors border-b border-[#e8ddd8]">
                        <td class="py-3 px-2 font-bold whitespace-nowrap text-urushi">${displayName}</td>
                        <td class="py-3 px-2 text-urushi font-bold">${s.avg}</td>
                        <td class="py-3 px-2 text-matcha font-bold text-lg">${s.high}</td>
                        <td class="py-3 px-2">${s.dist['100']} 人</td>
                        <td class="py-3 px-2">${s.dist['90']} 人</td>
                        <td class="py-3 px-2">${s.dist['80']} 人</td>
                        <td class="py-3 px-2">${s.dist['70']} 人</td>
                        <td class="py-3 px-2">${s.dist['60']} 人</td>
                        <td class="py-3 px-2 text-[#df9c9d] font-bold">${s.dist['under60']} 人</td>
                    </tr>
                `;
            }
            tbody.innerHTML = html;
        }

        function showChangePassword() { document.getElementById('password-modal').classList.remove('hidden'); }
        function hideChangePassword() {
            document.getElementById('password-modal').classList.add('hidden');
            document.getElementById('old-pw').value = '';
            document.getElementById('new-pw').value = '';
            document.getElementById('new-pw-confirm').value = '';
        }
        
        async function submitChangePassword() {
            const oldPw = document.getElementById('old-pw').value;
            const newPw = document.getElementById('new-pw').value;
            const confirmPw = document.getElementById('new-pw-confirm').value;

            if (!oldPw || !newPw || !confirmPw) return showToast('請填寫完整資訊');
            if (newPw !== confirmPw) return showToast('新密碼與確認密碼不符');

            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'changePassword', id: currentUser.id, oldPw: oldPw, newPw: newPw })
                });
                const data = await res.json();
                if(data.success) {
                    showToast('密碼修改成功');
                    hideChangePassword();
                } else { throw new Error(data.message); }
            } catch (err) { showToast(err.message); }
        }
    </script>
</body>
</html>
